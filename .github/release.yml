# Configuration of the release notes GitHub generates for a release.
# GitHub reads this file from the tag being released, so it has to be on the
# release branch before the tag is cut.
# The type labels are set from the PR title prefix by pr-type-label.yml.
# The cve and security labels are set by hand, cve only once the CVE is
# announced, after which the release notes can be generated again.
# The api-change label is set by hand on a pull request that changes or removes
# a public API, so that upgraders find it.
# A pull request is listed in the first category whose labels match, so the
# security and API categories come before the type categories.
# See https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - dependencies
    authors:
      - dependabot[bot]
  categories:
    - title: Security fixes
      labels:
        - cve
    - title: Security hardening
      labels:
        - security
    - title: API changes
      labels:
        - api-change
    - title: Bug fixes
      labels:
        - bug
    - title: Improvements
      labels:
        - enhancement
    - title: New features
      labels:
        - feature
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
