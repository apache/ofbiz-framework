# https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning

name: "CodeQL"

on:
  push:
    branches: [ trunk, release* ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ trunk, release* ]
  schedule:
    - cron: '27 15 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        languages: ${{ matrix.language }}
        debug: true
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    # Java is a compiled language: CodeQL extracts it by tracing the compilation,
    # so the sources must be built between the init and analyze steps.
    # The Gradle wrapper jar is not committed and must be downloaded first.
    # Only compilation is needed, so tests and other checks are not run.
    - name: Build with Gradle
      if: matrix.language == 'java'
      run: |
        ./gradle/init-gradle-wrapper.sh
        ./gradlew compileJava compileTestJava

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
