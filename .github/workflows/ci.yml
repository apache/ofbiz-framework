name: ci

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit + contract tests (ArchUnit layering enforced)
        run: ./gradlew build
      - name: Build service image
        run: docker build -t demo-svc:ci platform/demo-svc
      - name: Trivy scan (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: demo-svc:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
