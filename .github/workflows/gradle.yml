# This workflow will check style in OFBiz with its plugins
# For more information see: https://github.com/actions/setup-java

name: Java CI with Gradle

on:
  push:
    branches: [ trunk, release* ]
    # Changes that cannot affect `./gradlew check javadoc` (documentation, Docker/IDE/devcontainer
    # setup, Windows-only scripts, other workflows...) don't trigger the build: the ubuntu-latest
    # runners are a limited resource shared by all the ASF projects.
    # GitHub evaluates these patterns in order, so a later pattern can re-include a path that an
    # earlier "!" pattern excluded.
    paths: &build-paths
      - '**'
      - '!**.md'
      - '!**.adoc'
      - '!**/src/docs/**'
      - '!docs/**'
      - '!**.bat'
      - '!APACHE2_HEADER'
      - '!INSTALL'
      - '!LICENSE'
      - '!NOTICE'
      - '!OPTIONAL_LIBRARIES'
      - '!VERSION'
      - '!.asf.yaml'
      - '!.devcontainer/**'
      - '!.dockerignore'
      - '!.gitattributes'
      - '!.gitignore'
      - '!.hgignore'
      - '!.idea/**'
      - '!.pre-commit-config.yaml'
      - '!Dockerfile'
      - '!docker/**'
      - '!.github/**'
      - '.github/workflows/gradle.yml'
  pull_request:
    branches: [ trunk, release* ]
    paths: *build-paths

# A new push to a pull request makes its previous, still running or queued build useless.
# Pushes to trunk and release* are never cancelled so that every commit gets its own result.
# Each of them gets its own group (run_id): in a shared group a newer run would replace a pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # trunk builds sourceCompatibility/targetCompatibility 17 bytecode (see build.gradle),
    # but is matrix-tested on both the JDK 17 runtime it targets and the JDK 21 runtime
    # it may adopt later.
    # release* branches stay JDK 17 only until they adopt JDK 21 too, since trunk fixes must
    # stay backportable to them. github.base_ref is the target branch of a pull request and is
    # empty for a push, where github.ref_name is the pushed branch.
    strategy:
      fail-fast: false
      matrix:
        java: ${{ startsWith(github.base_ref || github.ref_name, 'release') && fromJson('[17]') || fromJson('[17, 21]') }}

    runs-on: ubuntu-latest

    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

    steps:
    - name: Check out OFBiz sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
        cache: 'gradle'

    - name: Grant execute permission for gradlew and pullAllPluginsSource.sh
      run: chmod +x gradlew gradle/init-gradle-wrapper.sh pullAllPluginsSource.sh

    - name: Initialize Gradle wrapper
      run: ./gradle/init-gradle-wrapper.sh

    - name: Load all plugins
      run: ./pullAllPluginsSource.sh

    - name: Build with Gradle
      run: ./gradlew check

    - name: Prepare Javadocs with Gradle
      run: ./gradlew javadoc

    - name: Load demo and test data with Gradle
      run: ./gradlew loadAll

    - name: Run integration tests with Gradle
      run: ./gradlew testIntegration
