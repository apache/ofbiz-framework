#############################################################################
# Local testing of this workflow can be carried out using
# act (https://github.com/nektos/act).
#
# Act will set an environment variable, ACT, to indicate that it is running the workflow.
# This environment variable is used to skip some build steps, such as logging in to
# a container registry and pushing container images.
#
# On first run, act will prompt you to select a micro, medium or large runner image. This
# workflow can be run using the medium image.
#
# Some actions, such as docker/metadata-action, require a GITHUB_TOKEN. To meet this
# requirement when using act you will need to create a Personal Access Token on GitHub.
# You can then run act using a command similar to:
#   act --job docker_build --secret GITHUB_TOKEN --var DO_DOCKER_PUSH=true
# Act will then prompt you to enter your token.

#############################################################################
# The images are only built and pushed if configuration variable DO_DOCKER_PUSH is set to 'true'.
# This ensures that repository forks do not build images that they cannot push to the
# ghcr.io/apache/ofbiz container registry.
# See https://docs.github.com/en/actions/learn-github-actions/variables#defining-configuration-variables-for-multiple-workflows
# for more information on configuring variables for a repository.

name: Build and push docker images

on:
  push:
    branches: [ trunk, release* ]
    tags:
      - '**'
    # Changes that cannot affect the images (Markdown files, IDE/devcontainer setup,
    # Windows-only scripts, other workflows...) don't trigger the build: the ubuntu-latest
    # runners are a limited resource shared by all the ASF projects.
    # These patterns are not evaluated for the push of a tag, which always builds the images.
    # GitHub evaluates these patterns in order, so a later pattern can re-include a path that an
    # earlier "!" pattern excluded.
    paths:
      - '**'
      - '!**.md'
      - '!**.bat'
      - '!.asf.yaml'
      - '!.devcontainer/**'
      - '!.gitattributes'
      - '!.gitignore'
      - '!.hgignore'
      - '!.idea/**'
      - '!.pre-commit-config.yaml'
      - '!.github/**'
      - '.github/workflows/docker-image.yml'

# Only the images of the latest push to a branch matter, as they replace the -snapshot images
# of the previous pushes, so a new push cancels the still running or queued build of the branch.
# The builds of tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  docker_build:
    name: Build and push OFBiz docker container images
    if: vars.DO_DOCKER_PUSH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push the container images to the GitHub container registry (ghcr.io).
      packages: write
    steps:
      - name: Check out OFBiz sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        if: ${{ !env.ACT && vars.DO_DOCKER_PUSH == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile keeps Gradle's dependency cache in a BuildKit cache mount (id=gradle-cache),
      # which is lost with the runner after each run. The next steps carry it over between runs with
      # actions/cache, so the images don't download every dependency from Maven Central again.
      # The docker-container driver is needed to read the cache mount back out at the end.
      # The helper builds below must not use --no-cache: it gives them an empty cache mount.
      # The RUN_ID build argument makes them run every time instead.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore Gradle cache
        id: gradle-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gradle-cache
          key: docker-gradle-${{ hashFiles('**/*.gradle', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: docker-gradle-

      - name: Load Gradle cache into the Docker build cache mount
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-cache"
          docker buildx build --build-arg RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --file - "$RUNNER_TEMP/gradle-cache" <<'DOCKERFILE'
          FROM eclipse-temurin:25@sha256:83f4a7fc27df94dcc7b8de04d14cbbba8da14406f921e966969c3b09000aa507
          ARG RUN_ID
          RUN --mount=type=cache,id=gradle-cache,sharing=locked,target=/root/.gradle \
              --mount=type=bind,source=.,target=/restore \
              cp -a /restore/. /root/.gradle/
          DOCKERFILE

      ############################################################################
      # Build and push a container image of the OFBiz Framework without any data loaded.
      - name: Determine metadata (tags, labels) for Docker runtime build
        id: runtimemeta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/apache/ofbiz
          tags: |
            # Extract container tag from git tag.
            type=match,pattern=release(.*),group=1
            # Build container tag based on branch name and string '-snapshot'
            type=ref,event=branch,suffix=-snapshot,priority=650

      - name: Update VERSION file
        run: |
          # Populate the VERSION file based on the outputs of the metadata-action above.
          # The same VERSION file will be used for all container images built in this workflow.

          # Set the version label for this build.
          echo "${{fromJSON(steps.runtimemeta.outputs.json).labels['org.opencontainers.image.version']}}. " > VERSION

          # Append the git commit SHA.
          echo '${uiLabelMap.CommonRevision}:' "${{fromJSON(steps.runtimemeta.outputs.json).labels['org.opencontainers.image.revision']}}. " >> VERSION

          # Append the timestamp.
          echo '${uiLabelMap.CommonBuiltOn}:' "${{fromJSON(steps.runtimemeta.outputs.json).labels['org.opencontainers.image.created']}}. " >> VERSION

          echo "Version file contents:"
          cat VERSION


      - name: Build and push runtime docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: ${{ !env.ACT && vars.DO_DOCKER_PUSH == 'true' }}
          tags: ${{ steps.runtimemeta.outputs.tags }}
          labels: ${{ steps.runtimemeta.outputs.labels }}

      ############################################################################
      # Build and push a container image of the OFBiz Framework preloaded with demo data
      - name: Determine metadata (tags, labels) for Docker demo-preload build
        id: demometa
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/apache/ofbiz
          tags: |
            type=match,pattern=release(.*),group=1,suffix=-preloaddemo
            type=ref,event=branch,suffix=-preloaddemo-snapshot,priority=650

      - name: Build and push demo docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: demo
          push: ${{ !env.ACT && vars.DO_DOCKER_PUSH == 'true' }}
          tags: ${{ steps.demometa.outputs.tags }}
          labels: ${{ steps.demometa.outputs.labels }}

        ############################################################################
        # Build and push a container image of the OFBiz Framework plus Plugins,
        # without any data loaded.
      - name: Grant execute permission for pullAllPluginsSource.sh
        run: chmod +x pullAllPluginsSource.sh
      - name: Load all plugins
        run: ./pullAllPluginsSource.sh
      - name: Determine metadata (tags, labels) for Docker framework with plugins build
        id: pluginsmeta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/apache/ofbiz
          tags: |
            type=match,pattern=release(.*),group=1,suffix=-plugins
            type=ref,event=branch,suffix=-plugins-snapshot,priority=650

      - name: Build and push framework with plugins docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: ${{ !env.ACT && vars.DO_DOCKER_PUSH == 'true' }}
          tags: ${{ steps.pluginsmeta.outputs.tags }}
          labels: ${{ steps.pluginsmeta.outputs.labels }}

      # Only the downloaded dependencies and the Gradle distribution are worth keeping between runs.
      - name: Read Gradle cache back out of the Docker build cache mount
        if: steps.gradle-cache-restore.outputs.cache-hit != 'true'
        run: |
          rm -rf "$RUNNER_TEMP/gradle-cache"
          mkdir -p "$RUNNER_TEMP/empty-context"
          docker buildx build --build-arg RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output type=local,dest="$RUNNER_TEMP/gradle-cache" --file - "$RUNNER_TEMP/empty-context" <<'DOCKERFILE'
          FROM eclipse-temurin:25@sha256:83f4a7fc27df94dcc7b8de04d14cbbba8da14406f921e966969c3b09000aa507 AS extract
          ARG RUN_ID
          RUN --mount=type=cache,id=gradle-cache,sharing=locked,target=/root/.gradle \
              mkdir -p /out/caches \
              && cp -a /root/.gradle/caches/modules-2 /out/caches/ \
              && cp -a /root/.gradle/wrapper /out/ \
              && find /out -name '*.lock' -delete \
              && rm -f /out/caches/modules-2/gc.properties
          FROM scratch
          COPY --from=extract /out /
          DOCKERFILE

      - name: Save Gradle cache
        if: steps.gradle-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gradle-cache
          key: ${{ steps.gradle-cache-restore.outputs.cache-primary-key }}
