# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# Each update runs the CI workflows on its pull request, again on each rebase
# after another pull request is merged, and once more when it is merged.
# To keep the number of jobs low, the updates are checked weekly and the minor
# and patch updates of each entry are grouped in a single pull request, while
# major updates, which need a closer review, still get their own pull request.
# A dependency is put in the first group it matches.

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 40
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "release24.09"
    labels:
      - "dependencies"
      - "java"
      - "release_branch"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 40
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # commons-imaging has been alpha-only since 2019 (alpha1..1.0.0-alpha6,
      # see the version catalog comment) with no stable release in sight;
      # we've deliberately deferred adapting to its post-alpha3 API changes
      # until it ships an actual 1.0.0. This keeps Dependabot from reopening
      # an alpha-to-alpha bump PR forever, while still surfacing a real 1.0.0
      # (or later) release when one finally happens. Trunk no longer needs
      # this rule (OFBIZ-13507 removed the dependency there); this branch
      # still has commons-imaging until that fix is backported.
      - dependency-name: "org.apache.commons:commons-imaging"
        versions: ["< 1.0.0"]

  - package-ecosystem: "npm"
    directory: "themes/common-theme/webapp/common-theme/js"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "framework/rest-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "themes/common-theme/webapp/common-theme/js"
    target-branch: "release24.09"
    labels:
      - "dependencies"
      - "javascript"
      - "release_branch"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/init"
          - "github/codeql-action/analyze"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    target-branch: "release24.09"
    labels:
      - "dependencies"
      - "github_actions"
      - "release_branch"
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/init"
          - "github/codeql-action/analyze"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    target-branch: "release24.09"
    labels:
      - "dependencies"
      - "docker"
      - "release_branch"
    schedule:
      interval: weekly
