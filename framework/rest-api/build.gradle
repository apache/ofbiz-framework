plugins {
    id 'ofbiz-node-conventions'
}

node {
    nodeProjectDir = file('.')
}

task copySwaggerUiAssets(type: Copy) {
    dependsOn npmInstall
    from 'node_modules/swagger-ui-dist'
    into 'webapp/docs'
    include 'swagger-ui-bundle.js', 'swagger-ui-bundle.js.map',
            'swagger-ui-standalone-preset.js', 'swagger-ui-standalone-preset.js.map',
            'swagger-ui.css', 'swagger-ui.css.map',
            'oauth2-redirect.html', 'favicon-16x16.png', 'favicon-32x32.png'
}

task copyRedocAssets(type: Copy) {
    dependsOn npmInstall
    from 'node_modules/redoc/bundles'
    include 'redoc.standalone.js'
    into 'webapp/docs'
}

task prepareDocAssets(dependsOn: [copySwaggerUiAssets, copyRedocAssets]) {
    description = 'Copy API documentation assets from npm packages into the webapp'
}

// Explicit delete task — NOT using auto-generated clean<Copy> rules because those
// would delete the entire 'webapp/docs' into-directory, including the HTML source files.
task cleanDocAssets(type: Delete, group: 'Cleaning',
        description: 'Remove generated API documentation assets (swagger-ui and redoc files)') {
    dependsOn cleanNpmInstall
    delete fileTree('webapp/docs') {
        include '*.js', '*.js.map', '*.css', '*.css.map',
                'favicon-*.png', 'oauth2-redirect.html',
                '*.txt', '*.LICENSE.txt', 'index.html', 'LICENSE', 'NOTICE', 'README.md'
    }
}

project.rootProject.tasks.getByName('classes').dependsOn prepareDocAssets
project.rootProject.tasks.clean.dependsOn cleanDocAssets
