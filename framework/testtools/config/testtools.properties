# -- Persist dated test-run history (manifest.json + copied XML/HTML) alongside the default
#    gradlew test / gradlew testIntegration output, so results survive being overwritten by the
#    next run. Default: false - current behavior (no history; each run's output is simply
#    overwritten in place, as it always has been). Same gradlew commands either way; only this
#    setting changes.
test.history=true

# -- Days to retain archived test-run history before the daily purge job removes it. Only read
#    when test.history=true above. Uncomment and set an actual value (e.g. 7) to enable
#    retention/purge; if test.history=true but this stays commented, history accumulates
#    indefinitely until you set a number.
test.history.days=7

# -- Directory gradlew test's history is archived under, when test.history=true above. Relative
#    paths resolve against the project root. Default (commented): build/test-reports-history - a
#    sibling of build/test-results/test, chosen so history survives `gradle clean` (see
#    test-report-archive.gradle's clean task exclusion, which is derived from this same value)
#    without sitting inside a directory other existing tooling already globs or deletes. Only
#    uncomment if you want history stored somewhere else, e.g. under runtime/ - if you point it
#    outside build/, the gradle clean exclusion becomes unnecessary and is skipped automatically.
#test.history.unit.dir=build/test-reports-history

# -- Directory gradlew testIntegration's history is archived under, when test.history=true above.
#    Default (commented): runtime/logs/test-reports-history - a sibling of
#    runtime/logs/test-results, so it's never nested inside the directory the pre-run cleanup step
#    and report generators already glob. Only uncomment if you want history stored somewhere else.
#test.history.integration.dir=runtime/logs/test-reports-history

# -- Enables the runTestSuite/getTestRunStatus REST-triggered test execution API (see
#    TestRunServices). Off by default: this is remote-triggered code execution, so it must be
#    explicitly opted into per environment. Checked via EntityUtilProperties (delegator-aware), so
#    it can also be flipped live via a SystemProperty row without a restart. Known POC limitation:
#    each triggered run creates a new test Delegator/LocalDispatcher, and while its
#    ServiceContainer-level cache entry is now removed after each run, the heavier ServiceDispatcher
#    instance behind it - including that test Delegator, which it keeps pinned - still accumulates
#    permanently (no public API to remove it) and startup services still re-run on every call; it
#    also runs against the live server's database with only best-effort rollback, not a true
#    isolated sandbox - see TestRunServices' class javadoc before enabling this in any
#    shared/long-lived environment.
test.api.enabled=false
