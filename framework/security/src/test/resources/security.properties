##############################################################################
# Test-only security.properties — shadows framework/security/config/security.properties
# on the test classpath so that tests requiring JWT keys (e.g. ModelFormTest)
# can run without the generateSecretKeys task.
#
# Keep this file minimal: only properties that tests actually need.
##############################################################################

# -- Secret key for autogenerated passwords (LoginWorker static init reads this)
login.secret_key_string=ACixT13j2ZBYC6d4GTsivE9ls6edoQQk4+MdAvFWIQzHMnYdrUZBUA0R5GtNGgQU

# -- JWT token expiration in seconds (JWTManager)
security.jwt.token.expireTime=1800

# -- JWT refresh token expiration in seconds (JWTManager)
security.jwt.refresh.token.expireTime=28800

# -- JWT signature key, 512 bits / 64 chars (JWTManager)
security.token.key=1bdy6YVULXL5N56o4iFGrNavvxwdywS2X6a1B/tDFPeU1A5MD85fjttJOdU/CApZ
