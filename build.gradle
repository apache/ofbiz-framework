.btn-check:checked + .btn-toggle-pass { background: var(--bs-success); border-color: var(--bs-success); color: #fff; }
.btn-check:checked + .btn-toggle-fail { background: var(--bs-danger); border-color: var(--bs-danger); color: #fff; }
