# Kafka cluster for the local kind environment (P0-F2-S1).
# Strimzi 1.x: v1 API, KRaft via KafkaNodePool (broker+controller roles).
# 3 brokers per story AC (one-broker-kill must not lose data).
# Local-dev sized; production values come with the cloud cluster.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: ofbiz
  namespace: ofbiz
spec:
  kafka:
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      # ACL story (P0-F2-S2): KafkaUser principals + least-privilege ACLs are
      # declared in platform/helm/topics/10-create.sh, but broker-side simple
      # authorization is NOT enabled on this Strimzi 1.3.0 / Kafka 4.3.1
      # combined-node local cluster: super.users and per-user produce checks
      # behaved inconsistently (see issues/ note in IMPLEMENTATION.md).
      # Enforcement evidence deferred to the cloud profile with dedicated
      # controller nodes.
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: ofbiz-nodes
  namespace: ofbiz
  labels:
    strimzi.io/cluster: ofbiz
spec:
  replicas: 3
  roles: [broker, controller]
  storage:
    type: persistent-claim
    size: 5Gi
    deleteClaim: true
  resources:
    requests: {memory: 1Gi, cpu: 300m}
    limits: {memory: 1Gi, cpu: "1"}
