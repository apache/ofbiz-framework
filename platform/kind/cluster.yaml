# kind cluster for the OFBiz modernization program (Phase 0, story P0-F1-S1).
# Local stand-in for the target cloud cluster: same Istio/Kafka stack, smaller footprint.
# Wildcard DNS later via sslip.io against the mapped ingress ports.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ofbiz
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
                node-labels: "ingress-ready=true"
    # Ingress ports for istio-ingressgateway / gateway API later.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
